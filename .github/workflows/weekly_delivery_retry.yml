name: Weekly Training Report Delivery Retry

on:
  schedule:
    # 台灣時間（UTC+8）週一 09:30 週報執行後的 23 小時重試窗口：
    # - 週一 14:00 / 20:00（UTC 06:00, 12:00）
    # - 週二 02:00（UTC 週一 18:00）
    # - 週二 08:00（UTC 週二 00:00）
    - cron: '0 6,12,18 * * 1'
    - cron: '0 0 * * 2'

concurrency:
  # Also serialize against Garmin sync and the weekly report workflow.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  retry-weekly-deliveries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retry prepared weekly reports
        env:
          DATABASE_MODE: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_DIRECT_URL: ${{ secrets.NEON_DATABASE_DIRECT_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python -m src.scripts.run_weekly_training_report --retry-only
