name: Weekly Training Report

on:
  schedule:
    # 台灣時間週一 09:30（UTC+8）— 留出 Daily pipeline 同步 Garmin 的時間。
    - cron: '30 1 * * 1'
  workflow_dispatch:

concurrency:
  # Serialize against the Daily Garmin sync before reading the completed week.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Weekly Training Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          DATABASE_MODE: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_DIRECT_URL: ${{ secrets.NEON_DATABASE_DIRECT_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          CORE_GOAL: ${{ vars.CORE_GOAL }}
          TRAINING_PREFERENCES: ${{ vars.TRAINING_PREFERENCES }}
        run: >-
          python -m src.scripts.run_weekly_training_report
          --core-goal "$CORE_GOAL"
          --training-preferences "$TRAINING_PREFERENCES"
