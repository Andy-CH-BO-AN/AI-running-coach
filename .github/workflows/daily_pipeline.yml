name: Daily AI Running Coach Pipeline

on:
  schedule:
    # 台灣時間 08:00 AM (UTC+8) = UTC 00:00 AM
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_MODE: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_DIRECT_URL: ${{ secrets.NEON_DATABASE_DIRECT_URL }}
          NEON_POSTGRES_USER: ${{ secrets.NEON_POSTGRES_USER }}
          NEON_POSTGRES_PASSWORD: ${{ secrets.NEON_POSTGRES_PASSWORD }}
        run: alembic upgrade head

      - name: Run AI Coach Pipeline
        env:
          GARMIN_ACCOUNT: ${{ secrets.GARMIN_ACCOUNT }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          DATABASE_MODE: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_DIRECT_URL: ${{ secrets.NEON_DATABASE_DIRECT_URL }}
          NEON_POSTGRES_USER: ${{ secrets.NEON_POSTGRES_USER }}
          NEON_POSTGRES_PASSWORD: ${{ secrets.NEON_POSTGRES_PASSWORD }}
        run: |
          python run_pipeline.py \
            --core-goal "${{ vars.CORE_GOAL }}" \
            --training-preferences "${{ vars.TRAINING_PREFERENCES }}"
